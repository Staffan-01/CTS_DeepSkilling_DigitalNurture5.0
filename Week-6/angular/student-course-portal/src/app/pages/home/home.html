<div class="home-container">
  <h1>{{ portalName }}</h1>
  <p>Welcome to the Student Course Portal. Browse courses, enroll, and track your academic progress.</p>

  <div class="stats-row">
    <div class="stat-card">
      <h3>Courses Available</h3>
      <p>{{ coursesCount }}</p>
    </div>
    <div class="stat-card">
      <h3>Enrolled</h3>
      <p>{{ enrolledCount }}</p>
    </div>
    <div class="stat-card">
      <h3>GPA</h3>
      <p>{{ gpa }}</p>
    </div>
  </div>

  <div class="enroll-section">
    <input type="text" [(ngModel)]="searchTerm" placeholder="Search courses...">
    <p>Searching for: {{ searchTerm }}</p>
    <button [disabled]="!isPortalActive" (click)="onEnrollClick()">Enroll Now</button>
    <p *ngIf="message" class="success-message">{{ message }}</p>
  </div>
</div>
